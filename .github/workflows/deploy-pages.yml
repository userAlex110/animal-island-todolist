name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel in-progress CI runs on the same ref to save runner minutes.
# Keep the deploy concurrency group separate (do not cancel in progress,
# so a successful deploy is never interrupted by a re-push).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: node test-demo.mjs

  deploy:
    needs: test
    # Only deploy on push to main, not on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Build a clean _site/ directory so node_modules / test helpers /
      # dotfiles never leak into the deployed artifact. The product is a
      # pure static site: index.html + css/ + js/ + any whitelisted assets.
      - name: Assemble deployment artifact
        run: |
          mkdir -p _site/css _site/js
          cp index.html _site/
          cp -R css/. _site/css/
          cp -R js/. _site/js/
          # Preserve dotfile-style assets (e.g. .well-known) only if they exist.
          find . -maxdepth 1 -name '.*' -not -name '.' -not -name '..' \
            -exec cp -R {} _site/ \; 2>/dev/null || true

      - name: Verify artifact cleanliness
        run: |
          set -euo pipefail
          if find _site -name 'package.json' -o -name 'package-lock.json' -o -name 'node_modules' -o -name 'test-*.mjs' | grep -q .; then
            echo "ERROR: deployment artifact contains forbidden files" >&2
            find _site -name 'package.json' -o -name 'package-lock.json' -o -name 'node_modules' -o -name 'test-*.mjs'
            exit 1
          fi
          echo "Artifact contents:"
          find _site -maxdepth 2 -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
