<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>动物岛每日手记 · Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="island-bg">
    <span class="leaf" style="--r:-15deg">🍃</span>
    <span class="leaf" style="--r:25deg">🌿</span>
    <span class="leaf" style="--r:10deg">🍃</span>
    <span class="leaf" style="--r:-30deg">🌱</span>
  </div>

  <div class="app">
    <header class="header">
      <h1 class="logo">动物岛每日手记</h1>
      <p class="subtitle">一天一页 · 像撕日历一样翻过每一天</p>
    </header>

    <div class="calendar-stand">
      <main class="paper-sheet" id="paperSheet">
        <div class="perforation"></div>

        <div class="date-bar">
          <div class="date-left">
            <h2 class="date-title">
              <span class="date-badge" id="dateBadge">2</span>
              <span id="dateText">7月2日 星期四</span>
              <span class="star-stamp" id="starStamp" hidden aria-label="今日之星">★</span>
            </h2>
            <button class="back-today-btn" id="backTodayBtn" onclick="backToToday()">回到今天</button>
          </div>
          <button id="pomodoroEntry" class="pomo-entry-btn" onclick="togglePomodoro()" aria-label="开启 25 分钟番茄钟">🍅 25:00</button>
          <div class="date-nav">
            <button onclick="changeDay(-1)" aria-label="前一天">‹</button>
            <button onclick="changeDay(1)" aria-label="后一天">›</button>
          </div>
        </div>

        <p class="swipe-hint">← 左右滑动翻页 →</p>

        <!-- Phase 3: long-horizon stats (heatmap + exam countdown) -->
        <section id="statsBar" class="stats-bar" aria-label="考研监督统计">
          <div class="stats-bar-row">
            <div class="heatmap-wrap" aria-label="番茄钟热力图（最近 371 天）">
              <div class="heatmap-label">最近 53 周专注度</div>
              <div id="heatmap" class="heatmap"></div>
              <div class="heatmap-legend" aria-hidden="true">
                <span>少</span>
                <span class="legend-cell heat-0"></span>
                <span class="legend-cell heat-1"></span>
                <span class="legend-cell heat-2"></span>
                <span class="legend-cell heat-3"></span>
                <span class="legend-cell heat-4"></span>
                <span>多</span>
              </div>
            </div>
            <div class="countdown-card" id="countdownCard" aria-label="考日倒计时">
              <div class="countdown-label">距离考日</div>
              <div class="countdown-value" id="countdownValue">—</div>
              <div class="countdown-suffix" id="countdownSuffix">点击右侧设置考日</div>
              <button class="countdown-set-btn" id="countdownSetBtn" onclick="openExamModal()" type="button">📅 设置考日</button>
            </div>
          </div>
        </section>

        <img class="wave-divider" src="https://raw.githubusercontent.com/guokaigdg/animal-island-ui/main/src/assets/img/dividers/wave-yellow.svg" alt="" />

        <div class="todo-list" id="todoList"></div>

        <div style="margin-top:18px; padding-left:24px;">
          <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--ink-light);">
            <span id="progressText">今日完成 0 / 3</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width:0%"></div>
          </div>
        </div>

        <div class="footer-illustration">
          <img src="https://raw.githubusercontent.com/guokaigdg/animal-island-ui/main/src/assets/img/footer/footer-sea.svg" alt="" />
        </div>

        <!-- Phase 1: Pomodoro focus panel — lives INSIDE paper-sheet so it
             inherits the same 680px paper width, paper texture, and shadow.
             We toggle visibility by adding .is-focus-mode to paper-sheet
             (which hides the day-view content) rather than overlay-positioning
             a separate element. Keeps the 手账纸 metaphor intact. -->
        <section id="pomodoroPanel" class="pomodoro-panel" hidden aria-label="番茄钟专注面板">
          <div class="mode-toggle" role="radiogroup" aria-label="番茄钟模式">
            <button data-mode="classic" class="mode-segment active" onclick="setPomodoroMode('classic')" role="radio" aria-checked="true">经典 25/5</button>
            <button data-mode="deep" class="mode-segment" onclick="setPomodoroMode('deep')" role="radio" aria-checked="false">深度 45/10</button>
          </div>
          <span class="focus-emoji" aria-hidden="true">🍅</span>
          <div class="focus-ring-wrap">
            <svg class="pomodoro-ring" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="bg" cx="60" cy="60" r="54" />
              <circle class="fg" cx="60" cy="60" r="54" />
            </svg>
            <div class="focus-time" id="pomodoroTime">25:00</div>
          </div>
          <p class="focus-subject" id="pomodoroSubject">自由专注</p>
          <div class="focus-actions">
            <button class="focus-toggle-btn" id="focusToggleBtn" onclick="togglePomodoro()" type="button">暂停</button>
            <button class="focus-bell-btn" id="focusBellBtn" onclick="unlockAudio(); playBell('focusEnd');" type="button" title="试听专注结束铃声">🔔</button>
            <button class="focus-giveup-btn" id="focusGiveupBtn" onclick="resetPomodoro()" type="button">结束</button>
          </div>
        </section>
      </main>
    </div>

    <footer class="footer">Demo · 动物岛风格待办笔记</footer>
  </div>

  <button class="floating-action" onclick="addTodo()" aria-label="新增待办事项">＋</button>

  <!-- Phase 3: exam date modal. Opened from #countdownSetBtn. Kept inline
       (no third-party) and minimal — one input + two buttons. -->
  <div id="examModalBackdrop" class="exam-modal-backdrop" hidden onclick="closeExamModal(event)">
    <div class="exam-modal" role="dialog" aria-label="设置考日" onclick="event.stopPropagation()">
      <h3 class="exam-modal-title">📅 设置考日</h3>
      <p class="exam-modal-hint">输入考试日期，热力图右上角会显示倒计时天数。</p>
      <input type="date" id="examDateInput" class="exam-modal-input" />
      <div class="exam-modal-actions">
        <button class="exam-modal-clear" id="examModalClear" type="button">清除</button>
        <button class="exam-modal-cancel" type="button" onclick="closeExamModal()">取消</button>
        <button class="exam-modal-save" type="button" onclick="saveExamDate()">保存</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
